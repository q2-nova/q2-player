[package]
license = "GPL-3.0-or-later"
name = "q2-wasm-demo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ab_glyph = "0.2.32"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.34"
fastrand = { version = "2.5.0", default-features = false, features = ["std"] }
q2-machines = { path = "../machines" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
zeroize = "1"

[workspace]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
