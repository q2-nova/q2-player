[package]
name = "subsonic"
version = "0.1.0"
edition = "2024"

[features]
scrobble-fixtures = []

[dependencies]
url = "2"
fastrand = "2.5.0"
log = "0.4.34"
md-5 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
flate2 = "1"
http-body-util = "0.1"
httpdate = "=1.0.3"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

xml-rs = "=0.8.29"

[dev-dependencies]
# Heap profiling of the streamed document parse (tests/document_memory.rs).
dhat = "0.3"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
