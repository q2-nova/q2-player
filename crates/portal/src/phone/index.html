<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Q2 Wi-Fi sign-in</title>
<link rel="stylesheet" href="/style.css">
<script defer src="/entry.js"></script>
</head>
<body>
<main>
<h1>Q2 Wi-Fi sign-in</h1>
<p>Send your SkyMiles sign-in details to your Q2 so it can join Delta Sync. Use this page only if you scanned the code on your own player.</p>
<form hidden>
<label>SkyMiles sign-in ID <input name="username" autocomplete="off" maxlength="254" required></label>
<label>Password <input type="password" name="password" autocomplete="off" maxlength="512" required></label>
<button>Send to my Q2</button>
</form>
<p role="status">Open the second QR code shown on your Q2.</p>
</main>
</body>
</html>
