name: Simulator first listen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/first-listen.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'assets/**'
      - 'crates/**'
      - 'tests/e2e/audiobookshelf-server.py'
      - 'tests/e2e/first-listen.py'
      - 'tests/ui/ux_fault_fixture.py'

permissions:
  contents: read

jobs:
  first-listen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Play the generated fixture
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          mkdir -p build/ci-cargo-home
          CARGO_HOME="$PWD/build/ci-cargo-home" python3 tests/e2e/first-listen.py --out build/first-listen
      - name: Check that the default build has no stall sampler
        run: |
          if nm build/first-listen-target/debug/q2nd | grep -E ' q2_stall_'; then
            echo 'the default q2nd build links the stall sampler' >&2
            exit 1
          fi
      - name: Summarize generated playback
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(Path("build/first-listen/result.json").read_text())
          print("## Simulator first listen")
          print()
          print("| Scenario | Playback advanced | Pause held |")
          print("| --- | ---: | ---: |")
          for key, label in (("first", "First listen"), ("offline_replay", "Offline Mode")):
              evidence = result[key]
              print(f"| {label} | {evidence['advanced_ms']} ms | {evidence['paused_for_ms']} ms |")
          PYTHON
      - name: Show first-listen diagnostics
        if: failure()
        run: |
          for log in build/first-listen/build.log build/first-listen/ffmpeg.log build/first-listen/{first,offline}/player.log; do
            if test -f "$log"; then
              tail -n 80 "$log"
            fi
          done

  audiobookshelf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Spoken journey against the official Audiobookshelf image
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          mkdir -p build/ci-cargo-home
          CARGO_HOME="$PWD/build/ci-cargo-home" python3 tests/e2e/audiobookshelf-server.py --out build/audiobookshelf
      - name: Summarize the spoken journey
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(Path("build/audiobookshelf/result.json").read_text())
          print(f"## Audiobookshelf {result['server']['version']}")
          print()
          print("| Item | Files | Chapters | Offline reopen | Covers |")
          print("| --- | ---: | ---: | --- | --- |")
          for outcome in result["result"]["outcomes"]:
              kind = "Podcast episode" if outcome["podcast"] else "Book"
              sizes = ", ".join(map(str, outcome["offline_cover_sizes"]))
              print(f"| {kind} | {outcome['physical_files']} | {outcome['chapters']} | {outcome['reopened_offline']} | {sizes} |")
          PYTHON
      - name: Show spoken journey diagnostics
        if: failure()
        run: |
          for log in build/audiobookshelf/build.log build/audiobookshelf/ffmpeg.log build/audiobookshelf/player.log build/audiobookshelf/server.log; do
            if test -f "$log"; then
              tail -n 80 "$log"
            fi
          done
