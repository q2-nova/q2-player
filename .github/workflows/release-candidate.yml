name: Q2 release candidate

on:
  pull_request:
    paths:
      - '.github/workflows/release-candidate.yml'
      - 'tools/release-candidate.py'
      - 'tools/release-source.py'
      - 'tools/release-symbols.py'
      - 'tools/verify-package.py'
      - 'tests/release/**'
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Named stock qualification prerelease containing the exact tested package
        type: string

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v

  compose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate_tag != ''
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      result_sha256: ${{ steps.compose.outputs.result_sha256 }}
      source_sha256: ${{ steps.compose.outputs.source_sha256 }}
      player_commit: ${{ steps.pin.outputs.player_commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve the candidate and its locked OS
        id: pin
        env:
          GH_TOKEN: ${{ secrets.Q2_COMPONENTS_READ_TOKEN || github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          [[ "$CANDIDATE_TAG" =~ ^stock-inputs-v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          source=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_TAG" \
            --jq 'if .commit.verification.verified then .sha else empty end')
          [[ "$source" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$source" "$GITHUB_SHA"
          printf 'player_commit=%s\n' "$source" >> "$GITHUB_OUTPUT"
          git show "$source:component-lock.json" |
            python3 -c 'import json,sys; print("os_commit=" + json.load(sys.stdin)["q2-os"])' >> "$GITHUB_OUTPUT"
          gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease | grep -Fx true
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern q2-stock-qualified-inputs.tar.gz --pattern q2-stock-qualified-inputs.tar.gz.sha256 \
            --dir build/stock-release-assets
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ vars.Q2_COMPONENTS_OWNER || 'q2-nova' }}/q2-os
          ref: ${{ steps.pin.outputs.os_commit }}
          token: ${{ secrets.Q2_COMPONENTS_READ_TOKEN || github.token }}
          path: build/release-os
          persist-credentials: false
      - name: Check the exact package tested on a physical Q2
        id: compose
        env:
          PLAYER_SOURCE: ${{ steps.pin.outputs.player_commit }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio squashfs-tools
          python3 tools/fetch-build-tools.py --stock-assets build/stock-release-assets --out build/release-inputs
          manifest_sha=$(sha256sum build/release-inputs/release-inputs.json | cut -d ' ' -f1)
          python3 tools/release-candidate.py --mode stock-draft --bundle build/release-inputs \
            --player-commit "$PLAYER_SOURCE" --manifest-sha256 "$manifest_sha" \
            --os-repo build/release-os --out build/release-candidate
          source_sha=$(python3 tools/release-source.py --package build/release-candidate/verified/update.tar \
            --record build/release-candidate/result.json --out build/release-candidate/verified/player-source.tar.gz)
          printf 'source_sha256=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'result_sha256=%s\n' "$(sha256sum build/release-candidate/result.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Transfer verified stock payload to the draft job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-verified-stock-candidate
          if-no-files-found: error
          path: |
            build/release-candidate/result.json
            build/release-candidate/verified/update.tar
            build/release-candidate/verified/player-source.tar.gz
            build/release-candidate/verified/q2nd-symbols.tar.gz

  draft:
    concurrency: q2-stock-draft
    needs: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Attach exact verified stock package to a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_SHA256: ${{ needs.compose.outputs.result_sha256 }}
          SOURCE_SHA256: ${{ needs.compose.outputs.source_sha256 }}
          PLAYER_SOURCE: ${{ needs.compose.outputs.player_commit }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name q2-verified-stock-candidate --dir candidate
          cd candidate
          [[ "$RESULT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  result.json\n' "$RESULT_SHA256" | sha256sum --check --strict
          read -r version package_sha source symbols_sha < <(python3 -c '
          import json, re
          with open("result.json") as fh:
              result = json.load(fh)
          assert result["mode"] == "stock-draft"
          fields = [("version", r"V[A-Za-z0-9.]{4}"), ("update_tar_sha256", r"[a-f0-9]{64}"),
                    ("player_commit", r"[a-f0-9]{40}"), ("symbols_sha256", r"[a-f0-9]{64}")]
          assert all(re.fullmatch(pattern, result[field]) for field, pattern in fields)
          print(*(result[field] for field, _ in fields))
          ')
          [[ "$source" == "$PLAYER_SOURCE" ]]
          printf '%s  verified/update.tar\n' "$package_sha" | sha256sum --check --strict
          [[ "$SOURCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  verified/player-source.tar.gz\n' "$SOURCE_SHA256" | sha256sum --check --strict
          printf '%s  verified/q2nd-symbols.tar.gz\n' "$symbols_sha" | sha256sum --check --strict
          printf '%s  update.tar\n%s  result.json\n%s  player-source.tar.gz\n%s  q2nd-symbols.tar.gz\n' \
            "$package_sha" "$RESULT_SHA256" "$SOURCE_SHA256" "$symbols_sha" > SHA256SUMS
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release or draft already exists for $version" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "A Git tag already exists for $version" >&2
            exit 1
          fi
          printf 'Stock Q2 candidate qualified on a physical device.\n\nPackage SHA-256: %s\n\nSee player-source.tar.gz for the LGPL libopenaptx notices, source and relink procedure. q2nd-symbols.tar.gz holds the unstripped and debug files for the executables in update.tar.\n' "$package_sha" > draft-notes.txt
          gh release create "$version" verified/update.tar result.json verified/player-source.tar.gz \
            verified/q2nd-symbols.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --target "$source" --title "Shanling Q2 $version" --notes-file draft-notes.txt
