name: Player release candidate

on:
  push:
    tags: ['v*-rc.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v

  build:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      package_sha256: ${{ steps.package.outputs.package_sha256 }}
      result_sha256: ${{ steps.package.outputs.result_sha256 }}
      source_sha256: ${{ steps.package.outputs.source_sha256 }}
      symbols_sha256: ${{ steps.package.outputs.symbols_sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" \
            --jq 'if .commit.verification.verified then .sha else empty end')
          [[ "$sha" == "$GITHUB_SHA" ]]
      - name: Admit tagged SDK, compiler, platform, TSRS and QEMU releases
        env:
          GH_TOKEN: ${{ secrets.Q2_COMPONENTS_READ_TOKEN || github.token }}
          COMPONENTS_OWNER: ${{ vars.Q2_COMPONENTS_OWNER || 'q2-nova' }}
        run: python3 tools/fetch-build-tools.py --owner "$COMPONENTS_OWNER" --out build/rc-inputs
      - name: Install package and QEMU runtime tools
        run: |
          mapfile -t runtime < <(jq -r '.files[].runtime_dependencies[].package' build/rc-inputs/qemu/qemu-artifact.json | sort -u)
          for name in "${runtime[@]}"; do
            [[ "$name" =~ ^[a-z0-9][a-z0-9+.-]*(:amd64)?$ ]]
          done
          sudo apt-get update
          sudo apt-get install -y cpio squashfs-tools podman "${runtime[@]}"
      - name: Fetch locked Cargo sources and build the paired target
        run: |
          nightly=$(jq -er .rust_toolchain build/rc-inputs/q2-os/os/sources.json)
          rustup toolchain install "$nightly" --profile minimal --component rust-src
          cargo "+$nightly" fetch --locked
          std_manifest="$PWD/build/rc-inputs/compiler/install/lib/rustlib/src/rust/library/Cargo.toml"
          cargo "+$nightly" fetch --locked --manifest-path "$std_manifest"
          python3 tools/build-target.py --component-lock build/rc-inputs/component-lock.json \
            --sdk build/rc-inputs/sdk/mipsel-buildroot-linux-gnu_sdk-buildroot \
            --toolchain-repo build/rc-inputs/q2-toolchain --compiler-work build/rc-inputs/compiler \
            --os-repo build/rc-inputs/q2-os --producer-inputs build/rc-inputs/producer-inputs.json \
            --out build/paired-player
          jq -e '.profile == "release" and .release_eligible == true and .features.q2nd == []' build/paired-player/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-paired-player
          path: build/paired-player/
          if-no-files-found: error
          compression-level: 0
      - name: Build the installed OS emulator fixture
        run: |
          inputs="$PWD/build/rc-inputs"
          python3 "$inputs/q2-os/os/compose_ci.py" --assets "$inputs/q2-os-assets" \
            --player-source "$PWD" --app "$PWD/build/paired-player/q2nd" \
            --tsrsd "$inputs/tsrs" --tsrs-source "$inputs/tsrs-source" \
            --release-tag V0.01 --qemu-user "$inputs/qemu/bin/qemu-mipsel" \
            --output "$inputs/q2-os/build/rc-image"
      - name: Pack, read back and boot the exact emulator archive
        id: package
        run: |
          inputs="$PWD/build/rc-inputs"
          python3 tools/verify-package.py pack --os-repo "$inputs/q2-os" \
            --component-lock "$inputs/component-lock.json" --image "$inputs/q2-os/build/rc-image" \
            --version V0.01 --installed-version V0.00 --out build/rc-package
          python3 tools/verify-package.py boot --os-repo "$inputs/q2-os" \
            --component-lock "$inputs/component-lock.json" --package build/rc-package/update.tar \
            --qemu "$inputs/qemu/bin/qemu-system-mipsel" --qemu-data "$inputs/qemu/share/qemu" \
            --native-qemu --out build/rc-boot
          mkdir build/rc-release
          cp build/rc-package/update.tar build/rc-release/update.tar
          package_sha=$(sha256sum build/rc-release/update.tar | cut -d ' ' -f1)
          jq -e --arg sha "$package_sha" '.update_tar_sha256 == $sha and .installed_root_ready and .player_ready' build/rc-boot/result.json
          jq -s '.[0] + {player_commit: env.GITHUB_SHA, player_tag: env.GITHUB_REF_NAME, components: .[1], release_inputs: .[2]}' \
            build/rc-boot/result.json "$inputs/component-lock.json" "$inputs/producer-inputs.json" > build/rc-release/result.json
          source_sha=$(python3 tools/release-source.py --package build/rc-release/update.tar \
            --record build/rc-release/result.json --producer-inputs "$inputs/producer-inputs.json" \
            --out build/rc-release/player-source.tar.gz)
          symbols_sha=$(python3 tools/release-symbols.py pack --build build/paired-player \
            --out build/rc-release/q2nd-symbols.tar.gz)
          printf 'package_sha256=%s\nresult_sha256=%s\nsource_sha256=%s\nsymbols_sha256=%s\n' "$package_sha" \
            "$(sha256sum build/rc-release/result.json | cut -d ' ' -f1)" "$source_sha" "$symbols_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-player-emulator-rc
          path: build/rc-release/
          if-no-files-found: error
          compression-level: 0

  prerelease:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency: player-rc-${{ github.ref_name }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Attach verified emulator-only rehearsal assets
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SHA: ${{ needs.build.outputs.package_sha256 }}
          RESULT_SHA: ${{ needs.build.outputs.result_sha256 }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha256 }}
          SYMBOLS_SHA: ${{ needs.build.outputs.symbols_sha256 }}
        run: |
          [[ "$PACKAGE_SHA" =~ ^[a-f0-9]{64}$ && "$RESULT_SHA" =~ ^[a-f0-9]{64}$ && "$SYMBOLS_SHA" =~ ^[a-f0-9]{64}$ ]]
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name q2-player-emulator-rc --dir candidate
          cd candidate
          printf '%s  update.tar\n%s  result.json\n%s  player-source.tar.gz\n%s  q2nd-symbols.tar.gz\n' \
            "$PACKAGE_SHA" "$RESULT_SHA" "$SOURCE_SHA" "$SYMBOLS_SHA" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          jq -e --arg tag "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
            --arg package "$PACKAGE_SHA" '.player_tag == $tag and .player_commit == $sha and .update_tar_sha256 == $package and .installed_root_ready and .player_ready' result.json
          gh release create "$GITHUB_REF_NAME" 'update.tar#QEMU emulator rehearsal only' result.json player-source.tar.gz \
            'q2nd-symbols.tar.gz#Unstripped and debug companions of q2nd and q2-portal' SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "Q2 emulator rehearsal $GITHUB_REF_NAME" \
            --notes 'Emulator rehearsal only. Keep this package off physical devices. player-source.tar.gz includes the LGPL libopenaptx notices, source and relink procedure. q2nd-symbols.tar.gz holds the unstripped and debug files for the executables in update.tar.'
