name: Build tool downloads
on:
  pull_request:
    paths:
      - '.github/workflows/build-tools.yml'
      - 'tools/fetch-build-tools.py'
      - 'tests/test_fetch_build_tools.py'
      - 'component-lock.json'
      - 'build-tools.lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: python3 tests/test_fetch_build_tools.py
