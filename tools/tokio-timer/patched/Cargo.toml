# The same program as ../Cargo.toml, linked against the workspace's patched tokio.
[package]
name = "tokio-timer-wake-patched"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "timer-wake-patched"
path = "../src/main.rs"

[dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "macros", "sync"] }

[patch.crates-io]
tokio = { git = "https://github.com/q2-nova/tokio", rev = "22ab0ee6ac7fc4be568acde63de8c6eac0f274b7" }

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
