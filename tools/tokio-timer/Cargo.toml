# Wakeups per timer expiry with upstream tokio (this manifest) and with the
# patched copy in crates/vendor/tokio (patched/Cargo.toml, same source file).
# A separate workspace: the product's lockfile is not involved.
[package]
name = "tokio-timer-wake"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "timer-wake-upstream"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "macros", "sync"] }

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
